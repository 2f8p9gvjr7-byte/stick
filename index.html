<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lire l'anglais</title>
  <meta name="description" content="Coller un texte anglais, l'écouter, puis le lire en français.">
  <meta name="theme-color" content="#3b2f7a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lire l'anglais">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Lire l'anglais</h1>
    <button id="btn-menu" class="icon-btn" aria-label="Menu">⋯</button>
  </header>

  <div id="menu" class="menu" hidden>
    <label class="field">
      <span>Voix</span>
      <select id="voice"></select>
    </label>
    <label class="field">
      <span>Vitesse <output id="rate-out">0,9</output></span>
      <input id="rate" type="range" min="0.5" max="1.3" step="0.05" value="0.9">
    </label>
    <label class="check">
      <input id="pause-between" type="checkbox" checked>
      <span>Petite pause entre les phrases</span>
    </label>
    <p class="hint">Astuce iPhone : les voix « Améliorée » ou « Premium » sont bien plus fluides. Réglages → Accessibilité → Contenu énoncé → Voix → Anglais, puis téléchargez-en une.</p>
    <p class="version">Version <span id="version"></span></p>
  </div>

  <main>
    <section class="card">
      <textarea id="src" rows="7" placeholder="Collez ici un texte en anglais…" lang="en" spellcheck="false"></textarea>
      <div class="row">
        <button id="btn-paste" class="ghost">📋 Coller</button>
        <button id="btn-clear" class="ghost">Effacer</button>
      </div>
    </section>

    <section class="actions">
      <button id="btn-play" class="primary">▶︎ Écouter</button>
      <button id="btn-pause" class="secondary" disabled>⏸ Pause</button>
      <button id="btn-stop" class="secondary" disabled>■</button>
    </section>

    <button id="btn-translate" class="primary wide">Traduire en français</button>

    <p id="status" class="status" role="status"></p>

    <section id="result" class="result" hidden>
      <div class="tabs" role="tablist">
        <button class="tab is-on" data-view="pairs" role="tab">Phrase par phrase</button>
        <button class="tab" data-view="full" role="tab">Texte entier</button>
      </div>
      <ol id="pairs" class="pairs"></ol>
      <div id="full" class="full" hidden>
        <p id="full-fr"></p>
        <div class="row">
          <button id="btn-copy" class="ghost">Copier la traduction</button>
          <button id="btn-say-fr" class="ghost">🔊 Écouter en français</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
